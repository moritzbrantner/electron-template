name: Update Monorepo

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Dispatch monorepo update
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          MONOREPO_DISPATCH_EVENT_TYPE: subtree-update
          MONOREPO_SUBTREE_DISPATCH_TOKEN: ${{ secrets.MONOREPO_SUBTREE_DISPATCH_TOKEN }}
          MONOREPO_TARGET_REPO: moritzbrantner/monorepo
        run: node ./scripts/dispatch-monorepo-update.mjs
