name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@scaffold-v2-initial
    with:
      install_command: bash scripts/with-maps-build-tools.sh bun install --frozen-lockfile
      lint_command: bun run lint
      test_command: bun run test:unit && bun run test:integration && bun run test:package
      build_command: bun run build
      e2e_command: bun run test:e2e
      install_playwright: true
      install_xvfb: true

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["quality"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["quality"]'
