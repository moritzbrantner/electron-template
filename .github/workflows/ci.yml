name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@workflow-standard-v1.2
    with:
      install_command: bun install --frozen-lockfile
      lint_command: bun run lint
      test_command: bun run test:unit && bun run test:integration && bun run test:package
      build_command: bun run build
      e2e_command: bun run test:e2e
      install_playwright: true
